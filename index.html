<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#020617" />
  <title>Email Confirmed | Meta Health</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #f8fafc;
      background:
        radial-gradient(circle at 20% 15%, rgba(34, 197, 94, 0.15), transparent 30%),
        radial-gradient(circle at 85% 85%, rgba(14, 165, 233, 0.12), transparent 30%),
        linear-gradient(135deg, #020617 0%, #071426 50%, #020617 100%);
    }

    .card {
      position: relative;
      width: min(100%, 520px);
      overflow: hidden;
      padding: 42px 32px 36px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.10);
      border-radius: 26px;
      background: rgba(255, 255, 255, 0.045);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 3px;
      background: linear-gradient(90deg, #22c55e, #4ade80, #0ea5e9);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 30px;
      color: #e2e8f0;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .brand-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 18px rgba(74, 222, 128, 0.95);
    }

    .check-wrap {
      width: 92px;
      height: 92px;
      display: grid;
      place-items: center;
      margin: 0 auto 26px;
      border: 1px solid rgba(74, 222, 128, 0.35);
      border-radius: 50%;
      background: rgba(34, 197, 94, 0.11);
      box-shadow: 0 0 42px rgba(34, 197, 94, 0.13);
    }

    .check {
      width: 42px;
      height: 42px;
      fill: none;
      stroke: #4ade80;
      stroke-width: 2.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    h1 {
      margin-bottom: 14px;
      font-size: clamp(30px, 8vw, 42px);
      line-height: 1.1;
      letter-spacing: -0.035em;
    }

    .lead {
      max-width: 410px;
      margin: 0 auto;
      color: #cbd5e1;
      font-size: 17px;
      line-height: 1.65;
    }

    .status {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-top: 28px;
      padding: 16px 18px;
      text-align: left;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      background: rgba(2, 6, 23, 0.48);
    }

    .status-icon {
      flex: 0 0 auto;
      margin-top: 2px;
      color: #4ade80;
      font-size: 18px;
    }

    .status p {
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.55;
    }

    .status strong {
      display: block;
      margin-bottom: 3px;
      color: #f8fafc;
      font-size: 14px;
    }

    .footer {
      margin-top: 28px;
      color: #64748b;
      font-size: 13px;
    }

    @media (max-width: 520px) {
      .card {
        padding: 36px 22px 30px;
        border-radius: 22px;
      }

      .lead {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <main class="card" aria-labelledby="page-title">
    <div class="brand">
      <span class="brand-dot" aria-hidden="true"></span>
      Meta Health
    </div>

    <div class="check-wrap" aria-hidden="true">
      <svg class="check" viewBox="0 0 24 24">
        <path d="M20 6 9 17l-5-5" />
      </svg>
    </div>

    <h1 id="page-title">Email Confirmed</h1>

    <p class="lead">
      Your Meta Health email has been verified successfully. Your account is now ready to use.
    </p>

    <div class="status">
      <div class="status-icon">✓</div>
      <p>
        <strong>You're all set.</strong>
        Return to the Meta Health app/web and sign in using your email and password. You can safely close this page.
      </p>
    </div>

    <p class="footer">Meta Health</p>
  </main>
</body>
</html>
